name: BLEMesh
options:
  bundleIdPrefix: com.noxrail
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, hi]

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4C8ZG43R2Q
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  MeshCore:
    path: Packages/MeshCore

targets:
  BLEMesh:
    type: application
    platform: iOS
    sources:
      - BLEMesh
    dependencies:
      - package: MeshCore
        product: MeshCore
      - package: MeshCore
        product: MeshSimulator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noxrail.app
        INFOPLIST_FILE: BLEMesh/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

  BLEMeshTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BLEMeshTests
    dependencies:
      - target: BLEMesh
      - package: MeshCore
        product: MeshCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noxrail.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BLEMesh.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BLEMesh
        BUNDLE_LOADER: $(TEST_HOST)

  BLEMeshUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - BLEMeshUITests
    dependencies:
      - target: BLEMesh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noxrail.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BLEMesh

schemes:
  BLEMesh:
    build:
      targets:
        BLEMesh: all
        BLEMeshTests: [test]
        BLEMeshUITests: [test]
    test:
      targets:
        - BLEMeshTests
        - BLEMeshUITests
      gatherCoverageData: true
